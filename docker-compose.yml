version: '3.8'
services:
  unbound:
    image: mvance/unbound:latest
    container_name: dns-recursivo-unbound
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./unbound.conf:/opt/unbound/etc/unbound/unbound.conf
      - ./root.hints:/opt/unbound/etc/unbound/root.hints
      - ./blocklist.zone:/opt/unbound/etc/unbound/blocklist.zone
    restart: always
