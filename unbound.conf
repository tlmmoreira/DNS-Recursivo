server:
    # Escuta em todas as interfaces do container
    interface: 0.0.0.0
    interface: ::0
    port: 53

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # DNS recursivo usando root hints
    root-hints: "/opt/unbound/etc/unbound/root.hints"
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"

    # IMPORTANTE: libere apenas suas redes/clientes
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # Adicione aqui seus blocos públicos do provedor, exemplo:
    # access-control: 100.64.0.0/10 allow
    # access-control: 200.200.200.0/24 allow
    # access-control: 2804:xxxx::/32 allow

    # Bloqueia consultas do restante da internet
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    # Segurança e privacidade
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    qname-minimisation: yes
    aggressive-nsec: yes

    # Performance/cache
    msg-cache-size: 128m
    rrset-cache-size: 256m
    cache-min-ttl: 60
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 3600

    # Threads - ajuste conforme CPU do servidor
    num-threads: 2
    so-reuseport: yes

    # Logs
    verbosity: 1
